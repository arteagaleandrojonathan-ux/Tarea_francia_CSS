    <dialog class="dialog dialog-instant" id="RegistrarProducto" aria-labelledby="tituloRegistrarProducto">
        <div class="dialog-header">
            <h2 class="dialog-title" id="tituloRegistrarProducto">Registrar producto</h2>
        </div>

        <div class="dialog-body">
            <form>
                <div class="mb-3">
                    <label for="marcaProducto" class="form-label">Marca</label>
                    <input type="text" class="form-control" id="marcaProducto" name="marca" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label for="descripcionProducto" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcionProducto" name="descripcion" rows="3" maxlength="200" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="precioProducto" class="form-label">Precio (S/)</label>
                    <input type="number" class="form-control" id="precioProducto" name="precio" min="0" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label for="stockProducto" class="form-label">Stock</label>
                    <input type="number" class="form-control" id="stockProducto" name="stock" min="0" step="1" required>
                </div>
            </form>
        </div>

        <div class="dialog-footer">
            <button type="button" class="btn-subtle theme-secondary" data-bs-dismiss="dialog">Cancelar</button>
            <button type="button" class="btn-solid theme-primary">Guardar</button>
        </div>

    </dialog>
